<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
</head>

<body>
    <h1>HTML &amp; CSS Online Quiz</h1>

    <form action="#" method="post">
        <!-- Question 1: Text input (fill in the blank) -->
        <div>
            <label for="q1">1. Fill in the blank: The CSS property used to change the text color of an element is ____.</label><br>
            <input type="text" id="q1" name="q1" required>
        </div>

        <br>

        <!-- Question 2: Textarea (short answer) -->
        <div>
            <label for="q2">2. Short Answer: Explain the difference between a class selector (.) and an ID selector (#) in CSS.</label><br>
            <textarea id="q2" name="q2" rows="4" cols="50" required></textarea>
        </div>

        <br>

        <!-- Question 3: Select dropdown -->
        <div>
            <label for="q3">3. Which HTML element is used to define the largest heading?</label><br>
            <select id="q3" name="q3" required>
                <option value="" selected disabled>Choose One ...</option>
                <option value="h1">&lt;h1&gt;</option>
                <option value="head">&lt;head&gt;</option>
                <option value="h6">&lt;h6&gt;</option>
                <option value="header">&lt;header&gt;</option>
            </select>
        </div>

        <br>

        <!-- Question 4: Number input (integer answer) -->
        <div>
            <label for="q4">4. How many heading levels (from largest to smallest) are defined in standard HTML?</label><br>
            <input type="number" id="q4" name="q4" min="1" max="10" step="1" required>
        </div>

        <br>

        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
