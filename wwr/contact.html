<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Blue Ocean Rafting Adventure</title>
    <meta name="description" content="Contact Blue Ocean Rafting Adventure for trip inquiries, reservations, customer support, and river location details.">
    <meta name="author" content="Obinna George Ibe">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/blueocean.jpeg" alt="Blue Ocean Rafting Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Centered Company Information Header -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+2348027445367 | +2348027445367</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Section 1: Google Map (Left) & Contact Form (Right) -->
        <section class="contact-box">
            <div class="map">
                <!-- Paste your Google Maps embed link inside src below -->
                <iframe src="" allowfullscreen=https://maps.app.goo.gl/VPzEvShKNMbkQYEb7?g_st=aw"" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Blue Ocean Rafting Location Map">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-item">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <div class="form-item">
                    <span class="purpose-label">Message Purpose</span>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="inquiry" name="purpose" value="General Inquiry" required>
                            <label for="inquiry">General Inquiry</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="reservation" name="purpose" value="Reservation Question">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="suggestion" name="purpose" value="Website Suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </div>

                <div class="form-column">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <!-- Section 2: Employee Profiles (3-Column Grid with Figure & Figcaption) -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employees-20.jpeg" alt="Employee profile photo 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee profile photo 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee profile photo 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Blue Ocean Rafting Adventure | Obinna George Ibe</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="images/twitter.svg" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
